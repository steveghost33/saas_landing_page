<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- Outer ring gradient -->
    <radialGradient id="outerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#041a3f"></stop>
      <stop offset="100%" stop-color="#00051a"></stop>
    </radialGradient>
    <!-- Middle ring gradient -->
    <radialGradient id="midGrad" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#032b6b"></stop>
      <stop offset="100%" stop-color="#001f4f"></stop>
    </radialGradient>
    <!-- Bubble gradient -->
    <radialGradient id="bubbleGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5cffff"></stop>
      <stop offset="100%" stop-color="#1de6f0"></stop>
    </radialGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="98" fill="url(#outerGrad)"></circle>

  <!-- Middle circle -->
  <circle cx="100" cy="100" r="78" fill="url(#midGrad)"></circle>

  <!-- Bubble -->
  <g fill="url(#bubbleGrad)" filter="url(#blur)">
    <!-- Main pill -->
    <rect x="50" y="60" width="100" height="60" rx="30" ry="30"></rect>
    <!-- Tail -->
    <path d="M110,120 L100,140 L120,120 Z"></path>
  </g>
</svg>
